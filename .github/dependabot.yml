# Dependabot configuration.
#
# Keeps dependencies up to date and flags security vulnerabilities.
# Grouped updates reduce PR noise — one PR per toolchain family (including
# major bumps, since packages in a family must move together) and one catch-all
# PR each for remaining production and dev minor/patch bumps.
#
# Groups are matched in the order defined below: a package lands in the first
# group whose patterns it matches.
#
# @see docs/adr/0008-dependency-security-with-dependabot.md

version: 2

updates:
  # npm / pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    reviewers:
      - "jeasmith"
    groups:
      # Next.js and React move in lockstep — a React major without matching
      # @types/react (or an eslint-config-next matching the Next version) does
      # not typecheck, so these belong in one PR.
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Vitest and its Vite peer must share a major.
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "@vitejs/*"
          - "jsdom"
          - "@testing-library/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # oxlint-tsgolint's version encodes the TypeScript version it targets
      # (7.0.2001 = TypeScript 7.0.2), and oxlint peers on it, so the linter
      # and the compiler have to move together.
      linting:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "typescript-eslint"
          - "typescript"
          - "prettier"
          - "prettier-plugin-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
          - "postcss"
          - "clsx"
          - "tailwind-merge"
          - "class-variance-authority"
          - "shadcn"
          - "@base-ui/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Everything not covered above: non-major bumps only, so a stray major
      # still lands in its own reviewable PR.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Security updates are always created regardless of grouping
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    reviewers:
      - "jeasmith"
    groups:
      # Action bumps are low-risk and reviewed as a batch — one PR for all.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
