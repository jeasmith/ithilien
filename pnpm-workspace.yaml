packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

peerDependencyRules:
  # Oxlint hosts eslint-plugin-react-hooks directly through jsPlugins. The
  # plugin's ESLint peer is not needed because ESLint never loads the plugin.
  ignoreMissing:
    - eslint

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
